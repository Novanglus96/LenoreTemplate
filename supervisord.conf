[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# Without these two sections `docker exec <container> supervisorctl status`
# fails with "*.ini file does not include supervisorctl section" — which is the
# first thing anyone reaches for when one of three processes in a single
# container misbehaves, and it is the wrong moment to discover the socket was
# never configured.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
command=gunicorn backend.wsgi:application --bind 127.0.0.1:8000 --workers 3
directory=/home/app/web
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Replaces the old separate `worker` container. Same command
# (backend/start_worker.sh still runs it that way for the dev compose), but the
# migrate steps are gone — start.app.sh has already run them before supervisord
# starts, so running them again here would race the web process.
[program:worker]
command=python manage.py qcluster
directory=/home/app/web
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
