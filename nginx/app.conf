server {
    listen 80;
    server_name localhost;
    proxy_intercept_errors on;

    # Vue SPA — serve the built static files, falling back to index.html so
    # client-side routes survive a page refresh. This replaces the old separate
    # `frontend` container, which was an nginx image that did nothing but serve
    # this directory and get proxied to by a second nginx.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Django API (django-ninja, mounted at /api/v1/ in backend/urls.py)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # django-allauth
    location /accounts/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # Django static files (admin, jazzmin, DRF browsable API)
    location /static/ {
        alias /home/app/web/staticfiles/;
    }

    # Django media files
    location /media/ {
        alias /home/app/web/mediafiles/;
    }
}
