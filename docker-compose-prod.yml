services:
  # One image, built from the repo root: the Vue bundle, Django under gunicorn,
  # the django-q worker and the nginx that fronts them. It replaces the old
  # frontend + backend + worker + nginx quartet. CI resolves what to publish
  # from this file — the `build-publish` stub passes `image_list: app`, so the
  # service name here and the name there must agree.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: /home/app/web/start.app.sh
    volumes:
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/mediafiles
      - postgres_bkp:/backups/
    ports:
      - 7000:80
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    env_file:
      - ./.env
    image: "{{PROJECT_SLUG}}:production"
    container_name: "{{PROJECT_SLUG}}"
    environment:
      - DEBUG=0
      - TZ=${TIMEZONE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/options/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:18-trixie
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    networks:
      - default
    container_name: "{{PROJECT_SLUG}}_db"
    environment:
      - TZ=UTC
      - POSTGRES_USER=${SQL_USER}
      - POSTGRES_PASSWORD=${SQL_PASSWORD}
      - POSTGRES_DB=${SQL_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  static_volume:
  media_volume:
  postgres_bkp:
